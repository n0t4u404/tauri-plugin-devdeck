<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>devdeck</title>
	<style>
		@font-face {
			font-family: "Inter";
			font-style: normal;
			font-weight: 100 900;
			src: url("fonts/inter-latin.woff2") format("woff2");
			font-display: swap;
			unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
		}

		:root {
			--font-family-body: "Inter", system-ui, sans-serif;

			--base-color-bg-primary: #0B0E14;
			--base-color-bg-primary-rgb: 11, 14, 20;

			--base-color-bg-secondary: #111620;
			--base-color-bg-secondary-rgb: 17, 22, 32;

			--base-color-bg-tertiary: #171D2A;
			--base-color-bg-tertiary-rgb: 23, 29, 42;

			--base-color-border-light: #C8D3F51F;
			--base-color-border-faint: #C8D3F50D;

			--base-color-text-primary: #F2F5FA;
			--base-color-text-primary-rgb: 242, 245, 250;

			--base-color-text-secondary: #8B95A7;
			--base-color-text-muted: #5B6474;

			--base-color-accent: #4C8DFF;
			--base-color-accent-rgb: 76, 141, 255;
			--base-color-accent-light: #6FA4FF;
			--base-color-accent-lighter: #9DC1FF;
			--base-color-accent-dark: #2F6BD9;

			--base-color-danger: #F2495C;
			--base-color-danger-rgb: 242, 73, 92;

			--base-color-success: #3DD68C;
			--base-color-success-rgb: 61, 214, 140;

			--ease-out-02s: ease-out 0.2s;
			--ease-out-strong-02s: cubic-bezier(0.23, 1, 0.32, 1) 0.2s;

			--border-radius-4px: 4px;
			--border-radius-8px: 8px;
			--border-radius-12px: 12px;

			color-scheme: dark;
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			display: grid;
			min-height: 100vh;
			font: 400 13px/1.4 var(--font-family-body);
			color: var(--base-color-text-secondary);
			background-color: var(--base-color-bg-primary);
			place-items: center;
		}
	</style>
</head>
<body>
	<p id="status">Waiting for the first sample…</p>

	<script>
		const status = document.getElementById("status");
		const megabytes = bytes => `${(bytes / 1024 / 1024).toFixed(1)} MB`;

		const poll = async () => {
			try {
				const response = await fetch("samples", { cache: "no-store" });
				const samples = response.ok ? await response.json() : [];
				const latest = samples.at(-1);
				
				if (latest) {
					const memory = latest.processes.reduce((sum, process) => sum + process.memory, 0);
					status.textContent = `${samples.length} samples · ${latest.processes.length} processes · ${megabytes(memory)}`;
				}
			} catch (error) {
				console.error("[devdeck]", error);
			}
			setTimeout(poll, 1000);
		}

		poll();
	</script>
</body>
</html>
