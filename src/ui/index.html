<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>devdeck</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<header class="topbar">
		<div class="brand">dev<span>deck</span></div>
		<span id="live" class="live is-stale">Live</span>
		<button id="record" class="button record" type="button">Record</button>
		<div class="chips">
			<span class="chip">Memory<b id="chip-memory">—</b></span>
			<span class="chip">CPU<b id="chip-cpu">—</b></span>
			<span class="chip">Processes<b id="chip-processes">—</b></span>
			<span class="chip">Uptime<b id="chip-uptime">—</b></span>
		</div>
	</header>
	<div id="saved" class="saved" hidden>
		<span id="saved-text"></span>
		<span id="saved-path" class="saved-path"></span>
		<button id="saved-reveal" class="button" type="button">Show in folder</button>
	</div>
	<div id="waiting" class="waiting"><span class="live">Waiting for the first sample</span></div>
	<div id="deck" hidden></div>
	<div id="tooltip" class="tooltip" hidden></div>

	<script type="module" src="js/main.js"></script>
</body>
</html>
